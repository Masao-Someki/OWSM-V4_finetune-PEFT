name: AutoResearch Wave Planner

on:
  push:
    branches: [autosearch]
    paths:
      - ".autoresearch/store/latest_status.json"
      - ".autoresearch/store/latest_metrics.json"
      - ".autoresearch/store/next_goal.md"
      - "prompt.txt"
  workflow_dispatch:

concurrency:
  group: autoresearch-planner
  cancel-in-progress: false  # Keep queued runs; do not skip.

jobs:
  plan-next-wave:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install omegaconf pyyaml

      - name: Configure git
        run: |
          git config user.name "autoresearch-bot"
          git config user.email "autoresearch-bot@users.noreply.github.com"

      - name: Detect planner mode
        id: mode
        run: |
          if [ -f .autoresearch/store/bootstrap_done.json ]; then
            echo "mode=iterative" >> "$GITHUB_OUTPUT"
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected mode: $(cat "$GITHUB_OUTPUT" | tail -1)"

      - name: Run ChatGPT autoresearch driver
        id: driver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python .autoresearch/claude_autoresearch_driver.py \
            --repo-root . \
            --prompts-dir .autoresearch/prompts \
            --csv-path .autoresearch/store/experiments.csv \
            --autoresearch-dir .autoresearch \
            --mode "${{ steps.mode.outputs.mode }}" \
            --model gpt-4o-mini \
            --max-configs 10 \
            --max-tokens 8192
