name: Config Validation CI

on:
  pull_request:
    branches: [main]
    paths:
      - "conf/**"
      - "array_conf/**"
      - "tests/**"
      - "prompts/search_plan.md"

jobs:
  validate-configs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest omegaconf pyyaml

      - name: Run config validation tests
        run: pytest tests/ -v --no-header -x --tb=short
