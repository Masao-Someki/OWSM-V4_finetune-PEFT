name: ChatGPT Test Writer

on:
  push:
    branches: [autosearch]

permissions:
  contents: write

jobs:
  write-chatgpt-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate text with ChatGPT via OpenAI API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          api_key = os.environ["OPENAI_API_KEY"]
          payload = {
              "model": "gpt-4o-mini",
              "input": "以下の2行だけをそのまま出力してください。\nhello world\ngithub actionから送ってまーす",
          }
          req = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          text = ""
          try:
              with urllib.request.urlopen(req) as res:
                  body = json.loads(res.read().decode("utf-8"))

              text = (body.get("output_text") or "").strip()
              if not text:
                  parts = []
                  for item in body.get("output", []):
                      for content in item.get("content", []):
                          if content.get("type") == "output_text":
                              t = (content.get("text") or "").strip()
                              if t:
                                  parts.append(t)
                  text = "\n".join(parts).strip()
          except urllib.error.HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace")
              text = (
                  "ChatGPT側でエラーが出たんだけど\n"
                  f"status: {e.code}\n"
                  f"reason: {e.reason}\n"
                  f"body: {err_body[:500]}"
              )
          except Exception as e:
              text = (
                  "ChatGPT側でエラーが出たんだけど\n"
                  f"reason: {type(e).__name__}: {e}"
              )

          if not text:
              text = "ChatGPT側でエラーが出たんだけど\nreason: empty response text"

          with open("chatgpt-test.txt", "w", encoding="utf-8") as f:
              f.write(text + "\n")
          PY

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- chatgpt-test.txt)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-test.txt
          git commit -m "test: update chatgpt-test.txt from ChatGPT"
          git push
