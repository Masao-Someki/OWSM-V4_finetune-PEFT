# Base training recipe template for PEFT experiments
# This file serves as the shared defaults for all per-experiment configs.
# Do not set exp_dir here; it is derived from exp_tag upstream.

# Generic training knobs (overridden per-config)
exp_tag: base_template
lr: 1e-4

optimizer:
  name: adamw

batch_size: 2
max_epochs: 1
warmup_steps: 0

# PEFT method settings (overridden per-config)
method:
  type: lora
  r: 8
  alpha: 16
  dropout: 0.05

# Trainer runtime safety (per-config may further lower)
trainer:
  max_steps: 100
