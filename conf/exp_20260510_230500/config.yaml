# Wave 1 unblock: run methods that are still unverified in this repo run history.
# Objective: get at least one clean completion to unlock Wave 2.

defaults:
  - ../owsm_peft_lora_basic.yaml

exp_name: exp_20260510_230500
wave: 1
axis: peft_type
notes: "Prior runs repeatedly failed before completion; keep debug gate and test missing PEFT families plus one baseline control."

# Keep debug-gate settings aligned with recent runs for comparability.
lr: 5e-5
trainer:
  max_epochs: 3
  max_steps: 100
  fast_dev_run: 10
  accumulate_grad_batches: 2
  gradient_clip_val: 5
  precision: bf16
seed: 2024

candidates:
  - exp_tag: exp_20260510_230500_lora_control
    peft:
      type: lora
      r: 8
      lora_alpha: 8
      lora_dropout: 0.05
      task_type: seq_2_seq_lm
      target_modules: ["linear_q", "linear_k", "linear_v", "linear_out", "w_1", "w_2"]

  - exp_tag: exp_20260510_230500_ia3
    peft:
      type: ia3
      task_type: seq_2_seq_lm
      target_modules: ["linear_q", "linear_k", "linear_v", "linear_out", "w_1", "w_2"]

  - exp_tag: exp_20260510_230500_oft
    peft:
      type: oft
      r: 8
      oft_block_size: 8
      module_dropout: 0.05
      task_type: seq_2_seq_lm
      target_modules: ["linear_q", "linear_k", "linear_v", "linear_out", "w_1", "w_2"]

  - exp_tag: exp_20260510_230500_vera
    peft:
      type: vera
      r: 8
      vera_dropout: 0.05
      task_type: seq_2_seq_lm
      target_modules: ["linear_q", "linear_k", "linear_v", "linear_out", "w_1", "w_2"]

  - exp_tag: exp_20260510_230500_loha
    peft:
      type: loha
      r: 8
      alpha: 8
      module_dropout: 0.05
      task_type: seq_2_seq_lm
      target_modules: ["linear_q", "linear_k", "linear_v", "linear_out", "w_1", "w_2"]