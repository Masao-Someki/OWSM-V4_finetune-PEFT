# Inference/decoding configuration for LibriSpeech 100h.
# Keeps only the keys required by the infer stage.
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  test:
    - name: test_falar
      dataset:
        _target_: src.data.dataset.FalarPortugalSingleDataset
        split: test

parallel:
  env: slurm
  n_workers: 4
  options:
    queue: general
    cores: 8
    processes: 1
    memory: 64GB
    walltime: "04:00:00"

    job_extra_directives:
      - "--gres=gpu:1"
    job_script_prologue:
      - "source ./path.sh"
    local_directory: "./_dask_tmp"

# Root output directory for .scp files written by the infer stage.
exp_tag: ${load_yaml:conf/whisper_peft_lora_basic_falar.yaml,exp_tag}
inference_dir: exp/${exp_tag}/infer

# Inference model: load the trained config/checkpoint.
model:
  _target_: src.peft_model.WhisperInferenceModel
  model_tag: openai/whisper-large-v3
  checkpoint_path: exp/${exp_tag}/epoch1_step6250_valid.loss.ckpt
  device: cuda

# Generic ESPnet3 inference entrypoint settings.
input_key: text
output_fn: src.peft_model.whisper_output_fn


provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider

runner:
  _target_: espnet3.systems.base.inference_runner.InferenceRunner
