# load default config
defaults:
  - default.yaml
  - dataset.yaml

lr: 5e-5
exp_tag: peft_lora_basic_lr${lr}

peft:
  type: lora
  r: 8
  lora_alpha: 8
  lora_dropout: 0.05
  task_type: seq_2_seq_lm
  target_modules: ["linear_q", "linear_k", "linear_v", "linear_out", "w_1", "w_2"]

model:
  _target_: src.peft_model.OWSMFinetune
  model_tag: ${base_model_tag}
  peft: ${peft}
