defaults:
  - ../default.yaml
  - ../dataset.yaml

exp_tag: exp_20260510_011434_lora_r4_alpha4

# LoRA r/alpha=4; low-capacity variant for debugging (stability)
peft:
  type: lora
  r: 4
  lora_alpha: 4
  lora_dropout: 0.05
  task_type: seq_2_seq_lm
  target_modules: ["linear_q", "linear_k", "linear_v", "linear_out", "w_1", "w_2"]

model:
  _target_: src.peft_model.OWSMFinetune
  model_tag: ${base_model_tag}
  peft: ${peft}

trainer:
  fast_dev_run: 10
  max_epochs: 1
  max_steps: 10

max_samples_per_subset_train: 4
max_samples_per_subset_valid: 4
max_samples_per_subset_test: 4
