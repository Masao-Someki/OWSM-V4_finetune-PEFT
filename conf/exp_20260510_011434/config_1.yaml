defaults:
  - ../default.yaml
  - ../dataset.yaml

exp_tag: exp_20260510_011434_adalora_r8_alpha8

# AdaLoRA candidate; diagnostic focus on stability after previous wave debug failure.
peft:
  type: adalora
  r: 8
  lora_alpha: 8
  lora_dropout: 0.05
  task_type: seq_2_seq_lm
  target_modules: ["linear_q", "linear_k", "linear_v", "linear_out", "w_1", "w_2"]

model:
  _target_: src.peft_model.OWSMFinetune
  model_tag: ${base_model_tag}
  peft: ${peft}

# Short debug-thru: minimal batch, steps, and epochs for crash debugging
trainer:
  fast_dev_run: 10
  max_epochs: 1
  max_steps: 10

max_samples_per_subset_train: 4
max_samples_per_subset_valid: 4
max_samples_per_subset_test: 4
