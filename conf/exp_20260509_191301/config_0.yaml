defaults:
  - ../base_recipe_template

# Goal: Stability-first smoke run to pass debug after prior DEBUG_FAILED.
# Phase: 1 (method-family), baseline_from_prompt = LoRA basic

exp_tag: exp_20260509_191301_lora_smoke_baseline

# Keep within prompt section-6 axes only
lr: 2e-4

optimizer:
  name: adamw

batch_size: 1
max_epochs: 1
warmup_steps: 10

method:
  type: lora
  r: 4
  alpha: 16
  dropout: 0.05

# Safety gates to avoid OOM and keep debug short
trainer:
  max_steps: 60
