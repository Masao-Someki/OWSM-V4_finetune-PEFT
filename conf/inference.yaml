# Common inference config shared across experiments.
# Override `train_config_path` per run (e.g., runtime train config) so exp paths propagate.

train_config_path: conf/owsm_peft_lora_basic.yaml
recipedir: .

exp_tag: default
exp_dir: ${recipedir}/exp/${exp_tag}
inference_dir: ${exp_dir}/infer

fleurs_repo: ${load_yaml:conf/dataset.yaml,fleurs_repo}
fleurs_subsets_test: ${load_yaml:conf/dataset.yaml,fleurs_subsets_test}
fleurs_cache_dir: ${load_yaml:conf/dataset.yaml,fleurs_cache_dir}
lang_sym_mode: ${load_yaml:conf/dataset.yaml,lang_sym_mode}
max_samples_per_subset_test: ${load_yaml:conf/dataset.yaml,max_samples_per_subset_test}

dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  test:
    - name: test_fleurs_all
      dataset:
        _target_: src.data.dataset.FleursDataset
        split: test
        hf_repo: ${fleurs_repo}
        hf_subsets: ${fleurs_subsets_test}
        cache_dir: ${fleurs_cache_dir}
        lang_sym_mode: ${lang_sym_mode}
        return_lang_sym: true
        max_samples_per_subset: ${max_samples_per_subset_test}

model:
  _target_: src.peft_model.OWSMV4BaseInferenceModel
  model_tag: ${load_yaml:conf/default.yaml,base_model_tag}
  lang_sym: <eng>
  # Set to a checkpoint path when evaluating a finetuned run.
  # Example: ${exp_dir}/checkpoints/last.ckpt
  checkpoint_path: null

parallel:
  env: local
  n_workers: 1

# Generic ESPnet3 inference entrypoint settings.
input_key:
  - speech
  - lang_sym
output_fn: src.peft_model.owsm_output_fn
idx_key: uttid
output_keys:
  - hyp
  - ref
batch_size: null

provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider

runner:
  _target_: espnet3.systems.base.inference_runner.InferenceRunner
