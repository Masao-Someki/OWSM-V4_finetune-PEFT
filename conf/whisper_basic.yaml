# load default config
defaults:
  - default.yaml
  - dataset_whisper.yaml

lr: 5e-6
exp_tag: falar_full_whisper_lr${lr}


dataloader:
  collate_fn:
    _target_: espnet2.train.collate_fn.CommonCollateFn
    int_pad_value: 50257
  train:
    iter_factory:
    batch_size: 2
    num_workers: 2
    shuffle: true
    pin_memory: true
    prefetch_factor: 2
  valid:
    iter_factory:
    batch_size: 2
    num_workers: 2
    shuffle: false
    pin_memory: true
    prefetch_factor: 2

scheduler:
  _target_: espnet2.schedulers.warmup_lr.WarmupLR
  warmup_steps: 4000

model:
  _target_: src.peft_model.WhisperFinetune
  model_tag: openai/whisper-large-v3
  peft: # if full finetune >> nul
