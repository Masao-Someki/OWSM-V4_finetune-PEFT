experiment:
  name: exp_20260510_220001
  comment: "wave1-peft-family [compatibility-gate-v2]"
  stages: ["train"]

base:
  model_tag: "espnet/owsm_ctc_v4_1B"
  learning_rate: 5.0e-5
  seed: 2024

train:
  trainer:
    fast_dev_run: 10
    max_epochs: 3
    max_steps: 100
    accumulate_grad_batches: 2
    gradient_clip_val: 5
    precision: bf16
    log_every_n_steps: 20
    limit_train_batches: 100

  optimizer:
    _target_: torch.optim.AdamW
    lr: 5.0e-5
    weight_decay: 1.0e-6

  scheduler:
    _target_: espnet2.schedulers.warmup_lr.WarmupLR
    warmup_steps: 6000

sweep:
  target_modules: ["linear_q", "linear_k", "linear_v", "linear_out", "w_1", "w_2"]
  peft_candidates:
    - type: lora
      r: 8
      lora_alpha: 8
      lora_dropout: 0.05
      task_type: seq_2_seq_lm
    - type: adalora
      r: 8
      lora_alpha: 8
      lora_dropout: 0.05
      task_type: seq_2_seq_lm
    - type: ia3
      task_type: seq_2_seq_lm
    - type: loha
      r: 8
      alpha: 8
      module_dropout: 0.05
      task_type: seq_2_seq_lm
    - type: lokr
      r: 8
      alpha: 8
      module_dropout: 0.05
      task_type: seq_2_seq_lm
    - type: vera
      r: 8
      vera_dropout: 0.05
      task_type: seq_2_seq_lm
    - type: oft
      r: 8
      module_dropout: 0.05
      task_type: seq_2_seq_lm
    - type: boft
      boft_block_size: 8
      boft_n_butterfly_factor: 2
      task_type: seq_2_seq_lm