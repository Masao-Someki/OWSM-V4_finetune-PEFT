recipedir: .

exp_tag: default
exp_dir: ${recipedir}/exp/${exp_tag}
stats_dir: ${exp_dir}/stats
dataset_dir: ""
seed: 2024
lr: 5e-5
base_model_tag: espnet/owsm_ctc_v4_1B

wandb:
  entity: ${oc.env:WANDB_ENTITY,masao-someki}
  project: ${oc.env:WANDB_PROJECT,owsm-peft-autoresearch}
  group: ${oc.env:WANDB_GROUP,manual}
  job_type: ${oc.env:WANDB_JOB_TYPE,train}
  name: ${exp_tag}_lr${lr}

num_device: 1
num_nodes: 1

parallel:
  env: local
  n_workers: 4

optimizer:
  _target_: torch.optim.AdamW
  lr: ${lr}
  weight_decay: 0.000001

scheduler:
  _target_: espnet2.schedulers.warmup_lr.WarmupLR
  warmup_steps: 6000


dataloader:
  collate_fn:
    _target_: espnet2.train.collate_fn.CommonCollateFn
    int_pad_value: -1
  train:
    iter_factory:
    shuffle: true
    batch_size: 4
  valid:
    iter_factory:
    shuffle: false
    batch_size: 4

best_model_criterion:
  - - valid/loss
    - 3
    - min

tokenizer:
  vocab_size: 50002
  character_coverage: 1.0
  model_type: bpe
  save_path: data/bpe_50000

trainer:
  max_epochs: 2
  precision: bf16
  accumulate_grad_batches: 2
  log_every_n_steps: 100
  gradient_clip_val: 5
  limit_train_batches: 100

  logger:
    - _target_: lightning.pytorch.loggers.WandbLogger
      entity: ${wandb.entity}
      project: ${wandb.project}
      save_dir: ${exp_dir}/wandb
      group: ${wandb.group}
      job_type: ${wandb.job_type}
      name: ${wandb.name}

  strategy: auto
